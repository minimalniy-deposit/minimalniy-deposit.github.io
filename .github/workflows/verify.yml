name: Weekly data check
on:
  schedule:
    - cron: '30 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/update-verified.mjs
      - run: node scripts/snapshot-terms.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/site.json src/data/history.json
          git diff --cached --quiet || git commit -m "chore: weekly data check $(date -u +%F)"
          git push
