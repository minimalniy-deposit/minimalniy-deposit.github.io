name: Sync demo-slot catalog
on:
  schedule:
    - cron: '30 5 * * *'   # daily 05:30 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts=false
      - run: node scripts/fetch-slots.mjs
        env:
          SLOTSREACH_API_KEY: ${{ secrets.SLOTSREACH_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/slots.json public/slots/img
          git diff --cached --quiet || git commit -m "chore: sync demo-slot catalog $(date -u +%F)"
          git push
