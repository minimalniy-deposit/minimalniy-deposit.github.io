name: Probe SlotsReach API
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect partner API
        env:
          KEY: ${{ secrets.SLOTSREACH_API_KEY }}
        run: |
          set +e; OUT=probe-result.txt; : > $OUT
          H="Authorization: Bearer $KEY"
          q() { echo "== $1" >> $OUT; curl -sS -m 30 -H "$H" -H "Accept: application/json" "$1" -o /tmp/b -w "%{http_code}\n" >> $OUT; python3 - <<'PY' >> $OUT 2>&1
          import json
          try:
              d=json.load(open('/tmp/b'))
          except Exception as e:
              print('not json', open('/tmp/b').read()[:300]); raise SystemExit
          if isinstance(d,dict):
              print('top keys:', list(d.keys()))
              for k,v in d.items():
                  if k!='data': print(' ',k,'=',json.dumps(v)[:300])
              items=d.get('data',[])
          else: items=d
          print('items:', len(items) if isinstance(items,list) else type(items))
          if isinstance(items,list) and items:
              print('item keys:', list(items[0].keys()))
              print('sample:', json.dumps(items[0],ensure_ascii=False)[:1500])
          PY
          echo >> $OUT; }
          S=gates-of-olympus-pragmatic-play
          { echo "== game page iframe/embed hints"; curl -sS -m 30 -A "Mozilla/5.0" "https://slotsreach.com/games/$S" | grep -o -i '<iframe[^>]*>\|https://[a-z0-9./_-]*\(demo\|embed\|play\|launch\|game\)[a-z0-9./_?=&-]*' | sort -u | head -40; echo; } >> $OUT
          for u in "https://slotsreach.com/api/partner/games?slug=$S" "https://slotsreach.com/api/partner/games?search=gates" "https://slotsreach.com/api/partner/games?provider=pragmatic-play&per_page=2" "https://slotsreach.com/api/partner/games?updated_since=2026-08-01&per_page=2" "https://slotsreach.com/api/partner/demo?slug=$S" "https://slotsreach.com/api/partner/games/$S/demo" "https://slotsreach.com/api/partner/embed?slug=$S" "https://slotsreach.com/embed/$S" "https://slotsreach.com/play/$S" "https://slotsreach.com/demo/$S" "https://slotsreach.com/api/partner/games?include=demo&per_page=1"; do
            echo "== $u" >> $OUT; curl -sS -m 30 -H "$H" -A "Mozilla/5.0" "$u" -o /tmp/b -w "%{http_code} %{content_type}\n" >> $OUT; head -c 600 /tmp/b | tr '\n' ' ' | sed "s/$KEY/***/g" >> $OUT; echo >> $OUT; echo >> $OUT
          done
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B probe-result && git add $OUT && git commit -qm "probe result" && git push -f origin probe-result
