name: Daily exchange rates
on:
  schedule:
    - cron: '30 5 * * *'   # daily 06:15 UTC (after Bank of Russia publishes)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-rates.mjs
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      - run: node scripts/fetch-bestchange.mjs
        env:
          BESTCHANGE_API_KEY: ${{ secrets.BESTCHANGE_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/rates.json src/data/rates-history.jsonl
          git diff --cached --quiet || git commit -m "chore: exchange rates $(date -u +%F)"
          git push
