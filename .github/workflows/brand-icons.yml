name: Fetch brand icons
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 3 * *'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save sharp@0.33
      - run: node scripts/fetch-brand-icons.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/brands
          git diff --cached --quiet || git commit -m "chore: refresh brand icons $(date -u +%F)"
          git push
